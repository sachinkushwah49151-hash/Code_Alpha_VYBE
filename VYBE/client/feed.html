<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home / VYBE</title>
  <meta name="description" content="VYBE — Authenticated Social Feed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Mobile Top Header Bar -->
  <header class="mobile-top-header">
    <a href="feed.html" class="vybe-brand">
      <span class="brand-glyph">V</span>
      <span>VYBE<span class="brand-tag">.</span></span>
    </a>
    <a href="messages.html" class="btn-ghost" aria-label="Direct Messages" style="padding: 6px;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </a>
  </header>

  <!-- App Shell: 3-Column Social Layout -->
  <div class="app-shell">

    <!-- 1. LEFT SIDEBAR NAVIGATION -->
    <aside class="app-sidebar-left">
      <div class="sidebar-top">
        <a href="feed.html" class="sidebar-brand-link vybe-brand">
          <span class="brand-glyph">V</span>
          <span>VYBE<span class="brand-tag">.</span></span>
        </a>

        <!-- Dynamic Nav Links -->
        <nav id="appSidebarNav" aria-label="Main Navigation"></nav>
      </div>

      <!-- User Profile Card / Menu at Bottom -->
      <div id="appSidebarUser"></div>
    </aside>

    <!-- 2. CENTER FEED (Visually Dominant) -->
    <main class="app-center-feed" id="mainFeedView">
      
      <!-- Sticky Top Filter Bar: For You | Following -->
      <div class="feed-top-bar" role="tablist">
        <button type="button" class="feed-tab-btn active" id="tabForYou" role="tab" aria-selected="true" data-filter="all">
          For You
        </button>
        <button type="button" class="feed-tab-btn" id="tabFollowing" role="tab" aria-selected="false" data-filter="following">
          Following
        </button>
      </div>

      <!-- Inline Post Composer -->
      <section class="feed-composer" aria-label="Create a post">
        <div class="composer-avatar-col">
          <img id="composerCurrentUserAvatar" src="" class="avatar avatar-md" alt="Your Avatar">
        </div>
        <div class="composer-input-col">
          <form id="inlineComposerForm">
            <textarea
              id="inlineComposerText"
              class="composer-textarea"
              placeholder="What's on your mind?"
              rows="1"
              maxlength="280"
              required
            ></textarea>

            <!-- Optional Image Preview Zone inside Inline Composer -->
            <div id="inlineComposerImgPreviewZone" style="display: none; margin: 8px 0; border-radius: 12px; overflow: hidden; position: relative;">
              <img id="inlineComposerImgPreview" src="" style="width: 100%; max-height: 240px; object-fit: cover;">
              <button type="button" id="inlineComposerRemoveImg" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;">
                ✕
              </button>
            </div>

            <!-- Image URL Input -->
            <div id="inlineComposerUrlInputZone" style="display: none; margin-top: 6px;">
              <input type="url" id="inlineComposerUrlInput" class="input-field" placeholder="Paste image URL..." style="padding: 6px 10px; font-size: 0.85rem;">
            </div>

            <div class="composer-footer">
              <div class="composer-actions-bar">
                <button type="button" class="composer-action-btn" id="inlineAttachPhotoBtn" title="Attach Photo">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </button>
                <button type="button" class="composer-action-btn" id="inlineAttachPollBtn" title="Create Poll">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </button>
              </div>

              <div class="composer-submit-group">
                <span id="inlineCharCounter" class="composer-char-limit">280</span>
                <button type="submit" class="btn btn-accent btn-sm" id="inlinePostSubmitBtn" disabled>
                  Post
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <!-- Post Stream (Varied Realistic Posts Rendered Here) -->
      <section class="post-stream" id="postsStreamContainer" role="feed" aria-label="Social Stream">
        <!-- Rendered dynamically by feed.js -->
      </section>

    </main>

    <!-- 3. RIGHT SIDEBAR (Discovery, Search, & Trending) -->
    <aside class="app-sidebar-right" id="appSidebarRight"></aside>

  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-bar" id="appMobileBottomBar" aria-label="Mobile Navigation"></nav>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/feed.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      renderAppNavigation('home');
      renderDiscoverySidebar();
      initFeedPage();
    });
  </script>
</body>
</html>
