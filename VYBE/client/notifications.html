<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity / VYBE</title>
  <meta name="description" content="Activity and notifications on VYBE.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Mobile Top Header -->
  <header class="mobile-top-header">
    <a href="feed.html" class="vybe-brand">
      <span class="brand-glyph">V</span>
      <span>VYBE<span class="brand-tag">.</span></span>
    </a>
    <a href="messages.html" class="btn-ghost" aria-label="Direct Messages" style="padding: 6px;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </a>
  </header>

  <div class="app-shell">

    <!-- 1. LEFT NAVIGATION -->
    <aside class="app-sidebar-left">
      <div class="sidebar-top">
        <a href="feed.html" class="sidebar-brand-link vybe-brand">
          <span class="brand-glyph">V</span>
          <span>VYBE<span class="brand-tag">.</span></span>
        </a>
        <nav id="appSidebarNav" aria-label="Main Navigation"></nav>
      </div>
      <div id="appSidebarUser"></div>
    </aside>

    <!-- 2. CENTER ACTIVITY STREAM -->
    <main class="app-center-feed">
      
      <!-- Top Bar: Activity Title & Mark All Read -->
      <div class="sticky-page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h1 style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em;" data-i18n="activity.title">Activity</h1>
        <button type="button" class="btn-ghost btn-sm" id="btnMarkAllRead" style="color: var(--accent); font-weight: 600;" data-i18n="activity.markAllRead">
          Mark all as read
        </button>
      </div>

      <!-- Filter Bar: All | Mentions | Followers -->
      <div class="activity-filter-bar">
        <button type="button" class="activity-chip-btn active" data-filter="all" data-i18n="activity.all">All</button>
        <button type="button" class="activity-chip-btn" data-filter="mentions" data-i18n="activity.mentions">Mentions</button>
        <button type="button" class="activity-chip-btn" data-filter="follow" data-i18n="activity.followers">Followers</button>
      </div>

      <!-- Activity Items List -->
      <section id="activityListContainer" role="feed" aria-label="Activity Feed"></section>

    </main>

    <!-- 3. RIGHT DISCOVERY SIDEBAR -->
    <aside class="app-sidebar-right" id="appSidebarRight"></aside>

  </div>

  <nav class="mobile-bottom-bar" id="appMobileBottomBar" aria-label="Mobile Navigation"></nav>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      renderAppNavigation('activity');
      renderDiscoverySidebar();
      initNotificationsPage();
    });
  </script>
</body>
</html>
