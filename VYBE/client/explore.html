<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore / VYBE</title>
  <meta name="description" content="Discover creators, trends, and popular ideas on VYBE.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Mobile Top Header -->
  <header class="mobile-top-header">
    <a href="feed.html" class="vybe-brand">
      <span class="brand-glyph">V</span>
      <span>VYBE<span class="brand-tag">.</span></span>
    </a>
    <a href="messages.html" class="btn-ghost" aria-label="Direct Messages" style="padding: 6px;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </a>
  </header>

  <div class="app-shell">

    <!-- 1. LEFT NAVIGATION -->
    <aside class="app-sidebar-left">
      <div class="sidebar-top">
        <a href="feed.html" class="sidebar-brand-link vybe-brand">
          <span class="brand-glyph">V</span>
          <span>VYBE<span class="brand-tag">.</span></span>
        </a>
        <nav id="appSidebarNav" aria-label="Main Navigation"></nav>
      </div>
      <div id="appSidebarUser"></div>
    </aside>

    <!-- 2. CENTER EXPLORE VIEW -->
    <main class="app-center-feed explore-container">
      
      <!-- Top Search Header -->
      <div class="explore-search-header">
        <div class="search-input-container">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="exploreSearchInput" class="search-native-input" placeholder="Search creators, hashtags, or topics..." data-i18n-placeholder="explore.searchPlaceholder">
        </div>
      </div>

      <!-- Live Search Results (Toggled when searching) -->
      <div id="exploreSearchResultsArea" style="display: none; padding: 16px 20px;">
        <div style="font-weight: 700; font-size: 1.05rem; margin-bottom: 14px;" data-i18n="explore.searchResults">Search Results</div>
        <div id="exploreSearchResultsList"></div>
      </div>

      <!-- Default Alive Discovery Content -->
      <div id="exploreDefaultContent">
        
        <!-- Visual Mosaic Discovery Grid -->
        <div class="explore-mosaic-grid">
          <div class="mosaic-tile" data-post-id="post_2">
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600&auto=format&fit=crop&q=80" alt="Architecture">
            <div class="mosaic-overlay">
              <span>♥ 78</span>
              <span>💬 6</span>
            </div>
          </div>
          <div class="mosaic-tile" data-post-id="post_3">
            <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=600&auto=format&fit=crop&q=80" alt="Workspace">
            <div class="mosaic-overlay">
              <span>♥ 52</span>
              <span>💬 9</span>
            </div>
          </div>
          <div class="mosaic-tile" data-post-id="post_6">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop&q=80" alt="Landscape">
            <div class="mosaic-overlay">
              <span>♥ 39</span>
              <span>💬 4</span>
            </div>
          </div>
          <div class="mosaic-tile">
            <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80" alt="Hardware">
            <div class="mosaic-overlay">
              <span>♥ 45</span>
              <span>💬 5</span>
            </div>
          </div>
          <div class="mosaic-tile">
            <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600&auto=format&fit=crop&q=80" alt="Artwork">
            <div class="mosaic-overlay">
              <span>♥ 62</span>
              <span>💬 8</span>
            </div>
          </div>
          <div class="mosaic-tile">
            <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop&q=80" alt="Development">
            <div class="mosaic-overlay">
              <span>♥ 58</span>
              <span>💬 7</span>
            </div>
          </div>
        </div>

        <!-- Section: Suggested Creators to Follow -->
        <div style="padding: 24px 20px 14px; border-bottom: 1px solid var(--border-hairline);">
          <div style="font-weight: 800; font-size: 1.15rem; margin-bottom: 14px; letter-spacing: -0.02em;" data-i18n="explore.creatorsTitle">
            Creators to Discover
          </div>
          <div id="exploreCreatorsList" style="display: flex; flex-direction: column; gap: 14px;"></div>
        </div>

        <!-- Section: Popular Ranked Posts -->
        <div style="padding: 20px 0;">
          <div style="font-weight: 800; font-size: 1.15rem; padding: 0 20px 12px; letter-spacing: -0.02em;" data-i18n="explore.trendingTitle">
            Trending Discussions
          </div>
          <div class="post-stream" id="explorePopularPostsStream"></div>
        </div>

      </div>

    </main>

    <!-- 3. RIGHT DISCOVERY SIDEBAR -->
    <aside class="app-sidebar-right" id="appSidebarRight"></aside>

  </div>

  <nav class="mobile-bottom-bar" id="appMobileBottomBar" aria-label="Mobile Navigation"></nav>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/explore.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth()) return;
      renderAppNavigation('explore');
      renderDiscoverySidebar();
      initExplorePage();
    });
  </script>
</body>
</html>
